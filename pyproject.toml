[project]
name = "gigi"
version = "0.1.0"
description = "Local document Q&A assistant powered by PyTorch + LangGraph"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "torch",
    "sentence-transformers",
    "langgraph",
    "typer",
    "httpx",
    "pypdf",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "ruff",
]

[project.scripts]
gigi = "gigi.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/gigi"]

# Force a CPU-only PyTorch wheel (smaller download, no CUDA runtime).
[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cpu" }

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"